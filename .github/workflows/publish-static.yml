name: Publish Ship static resources

on:
  push:
    branches: [main]
  schedule:
    # Refresh live GitHub contribution data every six hours, off the hour.
    - cron: "37 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ship-static-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  BUN_VERSION: "1.3.11"
  NODE_VERSION: "24.19.0"
  CLOUDFLARE_ACCOUNT_ID: "71491cd4dc4dc3257fde02fb3932b5aa"

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ship-static-production
      url: https://ship.freecodefund.xyz
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify trusted checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test and compile
        run: |
          bun run test
          bun run compile

      - name: Generate live leaderboard snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run cli generate --output dist/live-snapshot.json

      - name: Build static publication bundle
        env:
          SHIP_SNAPSHOT_PATH: dist/live-snapshot.json
        run: bun run static:build

      - name: Require scoped Cloudflare credential
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::ship-static-production requires CLOUDFLARE_API_TOKEN for the Gladium AI account."
            exit 1
          fi

      - name: Deploy exact bundle to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code --refs https://github.com/freecodexyz/ship.git refs/heads/main | awk 'NR == 1 {print $1}')"
          test "$live_main" = "$GITHUB_SHA"
          npx wrangler@4.122.0 pages deploy \
            --project-name=ship-freecodefund \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false

      - name: Verify published snapshot metadata
        run: |
          set -euo pipefail
          expected="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("dist/api/v1/index.json", "utf8")).snapshot.sha256)')"
          for attempt in 1 2 3; do
            received="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "https://ship.freecodefund.xyz/api/v1/snapshot.json?verify=$GITHUB_SHA-$attempt" | sha256sum | awk '{print $1}')" || true
            if [ "$received" = "$expected" ]; then exit 0; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Published snapshot does not match the verified bundle."
              exit 1
            fi
            sleep 5
          done
